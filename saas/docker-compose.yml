# Hermes SaaS — bot multi-tenant (worker de long polling). LLM via Groq (nuvem),
# então NÃO precisa de ollama. Banco MySQL 8 EXTERNO — configure MYSQL_* no Environment.
# Aplique antes o schema: saas/database/schema.sql.
services:
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      # --- Banco MySQL 8 (multi-tenant) ---
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-hermes_saas}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # --- Cérebro: Groq (nuvem, rápido) ---
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - SYSTEM_PROMPT=Você é o Hermes, um assistente útil e direto. Responda em português do Brasil.
      # --- Voz (Whisper + TTS via OpenAI). Vazio = voz off ---
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REMINDER_VOICE=${REMINDER_VOICE:-true}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-nova}
      # --- Fuso p/ data/hora e varredura de lembretes ---
      - TZ=${TZ:-America/Sao_Paulo}
