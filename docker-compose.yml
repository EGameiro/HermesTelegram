services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Descarrega o modelo da RAM após 10 min ocioso (libera memória p/ outros apps da VPS).
      # A 1ª mensagem depois disso recarrega o modelo (leva alguns segundos a mais).
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_data:/root/.ollama
    # Teto de memória: se estourar, o Docker mata SÓ o Ollama (protege os outros containers).
    # 3b cabe em 5g. Para testar o 8b, suba p/ 6g no Environment do Dokploy (OLLAMA_MEM_LIMIT=6g).
    mem_limit: ${OLLAMA_MEM_LIMIT:-5g}
    networks:
      - hermes

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OLLAMA_URL=http://ollama:11434
      # Troque p/ hermes3:8b no Environment do Dokploy (OLLAMA_MODEL=hermes3:8b) p/ testar o modelo maior.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-hermes3:3b}
      - SYSTEM_PROMPT=Você é o Hermes, um assistente útil e direto. Responda em português do Brasil.
      # Previsão do tempo real (Open-Meteo, sem API key). Cidade padrão e liga/desliga.
      - DEFAULT_CITY=${DEFAULT_CITY:-Jacareí}
      - WEATHER_ENABLED=${WEATHER_ENABLED:-true}
      # Contas a pagar: banco SQLite persistente + hora do dia p/ enviar lembretes.
      - BILLS_DB=/data/bills.db
      - REMINDER_HOUR=${REMINDER_HOUR:-8}
      # Transcrição de voz (Whisper da OpenAI). Vazio = áudio desligado.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Opcional: restringe quem pode usar o bot. Deixe vazio p/ liberar a todos.
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS:-}
    volumes:
      - bot_data:/data
    depends_on:
      - ollama
    networks:
      - hermes

volumes:
  ollama_data:
  bot_data:

networks:
  hermes:
